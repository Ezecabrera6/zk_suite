<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview por partes</title>
<style>
:root{--bg:#0b0c0f;--tx:#eef0f2;--dim:#8a909a;--acc:#ffc531}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px "Segoe UI",system-ui,sans-serif}
#w{display:flex;flex-direction:column;height:100vh;padding:10px;box-sizing:border-box;gap:8px}
video{flex:1;min-height:0;width:100%;background:#000;border-radius:10px;object-fit:contain}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:#22262e;color:var(--tx);border:1px solid #2a2e36;border-radius:8px;padding:7px 12px;font:inherit;font-weight:700;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}
#estado b{color:var(--acc)}#nota{color:var(--dim);font-size:13px}
#partes{display:flex;gap:4px;flex-wrap:wrap}
#partes button{min-width:44px;padding:5px 8px}#partes button.lista{background:#1f3324}#partes button:disabled{opacity:.35;cursor:default}
</style></head><body><div id="w">
<video id="v" controls playsinline></video>
<div id="bar"><button id="bEmp">▶ Empezar (con sonido)</button><span id="estado"></span></div>
<div id="partes"></div>
<div id="nota">Cada parte es 1 minuto del video terminado, con audio y gráficos. Va saliendo una detrás de otra: mirá las que ya están mientras se hacen las demás. Al terminar una parte pasa sola a la siguiente; si todavía no salió, espera.</div>
</div><script>
const Q=new URLSearchParams(location.search), VER=Q.get('v')||'v001', DIR=`/11_exports/previews/${Q.get('slug')||'fizzpro'}_${VER}_partes/`;   // ?v=v003&slug=…
let hechas=[], total=0, i=0;
async function refrescar(){
  try{total=(await (await fetch(DIR+'partes.json',{cache:'no-store'})).json()).total}catch(e){}
  try{const h=await (await fetch(DIR,{cache:'no-store'})).text();hechas=[...h.matchAll(/href="(parte_\d{2}\.mp4)"/g)].map(m=>m[1]).sort()}catch(e){hechas=[]}
  // la última de la lista puede estar escribiéndose: solo cuenta como lista si ya hay una siguiente o si están todas
  const listas=hechas.length===total?hechas.length:Math.max(0,hechas.length-1);
  estado.innerHTML=`Preview <b>${VER}</b> · <b>${listas}</b> de <b>${total||'?'}</b> partes listas · mirando la <b>${i+1}</b>`;
  const P=document.getElementById('partes');P.innerHTML='';
  for(let k=0;k<total;k++){const b=document.createElement('button');b.textContent=(k+1)+"'";b.disabled=k>=listas;b.className=(k<listas?'lista':'')+(k===i?' on':'');
    b.onclick=()=>{i=k;cargar(true)};P.appendChild(b)}
  return listas}
async function cargar(play){const listas=await refrescar();
  if(i<listas){v.src=DIR+`parte_${String(i+1).padStart(2,'0')}.mp4`;if(play)v.play().catch(()=>{})}
  else{estado.innerHTML+=' · esperando que salga…';setTimeout(()=>cargar(play),3000)}}
v.onended=()=>{if(i+1<(total||99)){i++;cargar(true)}};
bEmp.onclick=()=>{bEmp.style.display='none';cargar(true)};
setInterval(refrescar,4000);refrescar();
</script></body></html>
