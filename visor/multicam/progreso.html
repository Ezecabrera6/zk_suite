<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Render en vivo</title>
<style>
:root{--bg:#0b0c0f;--tx:#eef0f2;--dim:#8a909a;--acc:#ffc531}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px "Segoe UI",system-ui,sans-serif}
#w{display:flex;flex-direction:column;height:100vh;padding:10px;box-sizing:border-box;gap:8px}
video{flex:1;min-height:0;width:100%;background:#000;border-radius:10px;object-fit:contain}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{background:#22262e;color:var(--tx);border:1px solid #2a2e36;border-radius:8px;padding:7px 12px;font:inherit;font-weight:700;cursor:pointer}
#estado b{color:var(--acc)}#nota{color:var(--dim);font-size:13px}
</style></head><body><div id="w">
<video id="v" muted playsinline autoplay></video>
<div id="bar"><button id="bPlay">⏸ Pausa</button><button id="bIni">⏮ Desde el principio</button><span id="estado"></span></div>
<div id="nota">Muestra los planos a medida que el render los termina, en orden. Sin audio ni gráficos: esos se pegan al final. Para escuchar el corte, usá el visor.</div>
</div><script>
const VER=new URLSearchParams(location.search).get('v')||'v001', DIR=`/10_work/render_${VER}/shots/`;
let lista=[], i=0, pausa=false;
async function refrescar(){try{const h=await (await fetch(DIR,{cache:'no-store'})).text();
  lista=[...h.matchAll(/href="(\d{4}\.mp4)"/g)].map(m=>m[1]).sort()}catch(e){}
  estado.innerHTML=`Render <b>${VER}</b> · plano <b>${Math.min(i+1,lista.length)}</b> de <b>${lista.length}</b> hechos`+(i>=lista.length?' · esperando el próximo…':'')}
function siguiente(){if(pausa)return;if(i<lista.length){v.src=DIR+lista[i];v.play().catch(()=>{})}else setTimeout(async()=>{await refrescar();siguiente()},1500)}
v.onended=()=>{i++;refrescar();siguiente()};v.onerror=()=>{setTimeout(()=>{v.src=DIR+lista[i]+'?r='+Date.now();v.play().catch(()=>{})},1200)};
bPlay.onclick=()=>{pausa=!pausa;bPlay.textContent=pausa?'▶ Seguir':'⏸ Pausa';pausa?v.pause():(v.src?v.play():siguiente())};
bIni.onclick=()=>{i=0;siguiente()};
setInterval(refrescar,3000);refrescar().then(siguiente);
</script></body></html>
